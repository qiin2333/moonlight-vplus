name: "✨ 功能建议 / Feature Request"
description: "建议新功能或改进 / Suggest a new feature or improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 功能建议 / Feature Request
        
        感谢您花时间提出新功能建议！
        Thank you for taking the time to suggest a new feature!
        
        在此之前，您需要知道此项目的名称为 基地版Moonlight 威力加强版 / V+ / Vplus，后续交流可能会使用其中任一名称。
        Before you submit, you need to know that the name of this project is Foundation Moonlight / V+ / Vplus, and we may use any of these names in our future communication.
        
        **提交前请检查 / Please check before submitting：**
        - [ ] 我已搜索现有 issues，避免重复 / I have searched existing issues and feature requests to avoid duplicates
        - [ ] 此功能在最新版本中尚不可用 / This feature is not already available in the latest version
        ---
        
  - type: dropdown
    id: feature-type
    attributes:
      label: "🏷️ 功能类别 / Feature Category"
      description: "这是什么类型的功能？ / What type of feature is this?"
      options:
        - "🎮 手柄控制器 / Gamepad Controller"
        - "📱 触控操作 / Touch Controls"
        - "📺 视频显示 / Video Display"
        - "🔊 音频 / Audio"
        - "⚙️ 设置配置 / Settings"
        - "🎨 界面体验 / UI Design"
        - "🌐 网络连接 / Network Connection"
        - "🔋 性能优化 / Performance"
        - "🔧 无障碍功能 / Accessibility"
        - "❓ 其他 / Other"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "📊 优先级 / Priority"
      description: "这个功能对您有多重要？ / How important is this feature to you?"
      options:
        - "🔴 关键 - 没有它无法使用 / Critical - Can't use app without it"
        - "🟠 高 - 显著改善体验 / High - Significantly improves experience"
        - "🟡 中 - 有了更好 / Medium - Nice to have"
        - "🟢 低 - 小改进 / Low - Minor improvement"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "😤 问题描述 / Problem Statement"
      description: |
        您的功能请求是否与某个问题相关？请描述您遇到的困扰。
        Is your feature request related to a problem? Describe the frustration.
      placeholder: |
        示例 / Example:
        当我无法在游戏过程中调整屏幕按钮大小时，我总是很沮丧。我必须退出游戏，更改设置，然后重新开始串流。
        
        I'm always frustrated when I can't adjust the on-screen button size during gameplay. I have to quit the game, change settings, and restart streaming.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "💡 建议的解决方案 / Proposed Solution"
      description: |
        描述您希望的解决方案。请尽可能具体。
        Describe the solution you'd like. Be as specific as possible.
      placeholder: |
        示例 / Example:
        允许在游戏过程中通过快捷手势（如双指缩放）调整屏幕按钮大小，无需退出游戏。
        
        Allow adjusting on-screen button size with a quick gesture (like pinch-to-zoom) during gameplay, without needing to exit the game.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 替代方案 / Alternative Solutions"
      description: |
        您是否考虑过任何替代解决方案或变通办法？
        Have you considered any alternative solutions or workarounds?
      placeholder: |
        示例 / Example:
        1. 一个浮动设置按钮，可以打开快捷设置菜单
        2. 预设按钮大小，可以快速切换
        
        1. A floating settings button that opens a quick settings menu
        2. Preset button sizes that can be quickly switched
    validations:
      required: false

  - type: textarea
    id: use-case
    attributes:
      label: "🎯 使用场景 / Use Case"
      description: |
        描述一个这个功能会很有用的具体场景。
        Describe a specific scenario where this feature would be useful.
      placeholder: |
        示例 / Example:
        当玩《艾尔登法环》等动作游戏时，我经常需要更大的攻击按钮但更小的移动控制。能够即时调整大小会节省很多时间。
        
        When playing action games like Elden Ring, I often need larger attack buttons but smaller movement controls. Being able to resize them on-the-fly would save a lot of time.
    validations:
      required: false

  - type: dropdown
    id: willing-to-test
    attributes:
      label: "🧪 愿意测试吗？ / Willing to Test?"
      description: "如果实现了此功能，您愿意帮忙测试吗？ / Would you be willing to test this feature if implemented?"
      options:
        - "是，我可以测试并提供反馈 / Yes, I can test and provide feedback"
        - "也许，取决于时间 / Maybe, depends on timing"
        - "否 / No"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 📎 附加信息 / Additional Information

  - type: textarea
    id: screenshots
    attributes:
      label: "📸 效果图/参考 / Mockups/References"
      description: |
        添加效果图、草图，或其他有类似功能的应用的参考截图。
        Add mockups, sketches, or reference screenshots from other apps that have similar features.
      placeholder: "在此处拖放图片 / Drag and drop images here"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "💬 其他补充 / Additional Context"
      description: |
        关于此功能请求的任何其他上下文？相关问题？实现建议？
        Any other context about the feature request? Related issues? Implementation suggestions?
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: "📱 您的设备 / Your Device"
      description: "您的设备型号（帮助我们理解使用场景） / Your device model (helps us understand the use case)"
      placeholder: "例如 / e.g. Samsung Galaxy S23 / 小米 Pad 6"
    validations:
      required: false
