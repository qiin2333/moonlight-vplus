name: Publish v12.16 once

on:
  push:
    branches: ['ops/publish-v12.16-20261128']
    paths: ['.github/workflows/publish-v12.16-once.yml']

permissions:
  contents: write
  actions: write

jobs:
  dispatch-release:
    if: github.repository == 'qiin2333/moonlight-vplus'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: publish-v12.16-once
      cancel-in-progress: false
    steps:
      - name: Verify release target, create tag and dispatch Android CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 4e202627570362e5ac4fb156e03a784044ceda03
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = 'qiin2333/moonlight-vplus'
          TAG = 'v12.16'
          BRANCH = 'refs/heads/ops/publish-v12.16-20261128'
          ORIGINAL_SHA = 'bef894e6948e23dedff4edbc922953dffff5fd70'
          TARGET_SHA = os.environ['RELEASE_SHA']
          assert os.environ['GITHUB_REPOSITORY'] == REPO, 'unexpected repository'
          assert os.environ['GITHUB_REF'] == BRANCH, 'unexpected operations branch'
          assert os.environ['GITHUB_EVENT_NAME'] == 'push', 'unexpected trigger'
          assert re.fullmatch(r'[0-9a-f]{40}', TARGET_SHA), 'release SHA must be pinned'

          def api(path, method='GET', payload=None, missing=False):
              assert path.startswith(f'repos/{REPO}/'), 'unexpected API repository'
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  'https://api.github.com/' + path, data=data, method=method,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2026-03-10',
                  })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
              except urllib.error.HTTPError as error:
                  if missing and method == 'GET' and error.code == 404:
                      return None
                  raise RuntimeError(f'GitHub API {method} {path}: HTTP {error.code}') from error
              return json.loads(body) if body else None

          def commit_ref(path, missing=False):
              ref = api(f'repos/{REPO}/git/ref/{path}', missing=missing)
              if ref is None:
                  return None
              assert ref['object']['type'] == 'commit', f'{path} is not a lightweight commit ref'
              return ref['object']['sha']

          assert commit_ref('heads/master') == TARGET_SHA, 'master changed; review the target again'
          assert commit_ref('tags/v12.15.46') == ORIGINAL_SHA, 'original failed release tag changed'
          assert commit_ref(f'heads/{TAG}', missing=True) is None, 'same-name branch would make dispatch ambiguous'
          existing_tag = commit_ref(f'tags/{TAG}', missing=True)
          assert existing_tag in (None, TARGET_SHA), 'release tag already points elsewhere'
          assert api(f'repos/{REPO}/releases/tags/{TAG}', missing=True) is None, 'release already exists; inspect its run instead'

          query = urllib.parse.urlencode({'branch': TAG, 'per_page': 100})
          runs = api(f'repos/{REPO}/actions/workflows/android-ci.yml/runs?{query}')['workflow_runs']
          for run in runs:
              assert run['head_branch'] == TAG and run['head_sha'] == TARGET_SHA, 'unexpected existing release run'
          if runs:
              assert existing_tag == TARGET_SHA, 'existing run has no matching release tag'
              print('Release workflow already exists; inspect or retry it without dispatching a duplicate:')
              for run in runs:
                  print(run['id'], run['status'], run.get('conclusion'), run['html_url'])
          else:
              if existing_tag is None:
                  created = api(f'repos/{REPO}/git/refs', 'POST',
                                {'ref': f'refs/tags/{TAG}', 'sha': TARGET_SHA})
                  assert created['ref'] == f'refs/tags/{TAG}'
                  assert created['object']['sha'] == TARGET_SHA
              assert commit_ref(f'tags/{TAG}') == TARGET_SHA, 'release tag verification failed'
              # GITHUB_TOKEN tag pushes do not start push workflows. Dispatching
              # the existing workflow explicitly runs its normal tag release path.
              result = api(f'repos/{REPO}/actions/workflows/android-ci.yml/dispatches',
                           'POST', {'ref': TAG})
              assert isinstance(result, dict) and isinstance(result.get('workflow_run_id'), int), 'dispatch did not return a run ID; inspect runs before retrying'
              run = api(f'repos/{REPO}/actions/runs/{result["workflow_run_id"]}')
              assert run['head_sha'] == TARGET_SHA and run['head_branch'] == TAG, 'dispatched run points to an unexpected commit or ref'
              assert run['event'] == 'workflow_dispatch', 'unexpected dispatched event'
              print(f'Dispatched and verified Android CI for {TAG} at {TARGET_SHA}')
              print(run['id'], run['status'], run['html_url'])
          PY
