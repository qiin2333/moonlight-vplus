name: Android USB/IP backend
on:
  push:
    paths: ['usbip-backend/**', 'usbip-diagnostics/**', '.github/workflows/usbip-backend.yml']
  pull_request:
    paths: ['usbip-backend/**', 'usbip-diagnostics/**', '.github/workflows/usbip-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-arm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            artifact: arm64
          - abi: armeabi-v7a
            artifact: armv7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        # 必须显式给 packages：该 action 缺省安装的 'tools' 包已被 SDK 仓库移除，
        # 会让 build-arm 在装环境阶段直接失败；其余包由下一步自行安装。
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native toolchain
        run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build standalone diagnostics, AAR and device tests
        run: bash gradlew -p usbip-diagnostics assembleDebug :usbip-backend:assembleDebug :usbip-backend:assembleDebugAndroidTest :usbip-backend:testDebugUnitTest -PusbipTestAbi=${{ matrix.abi }} --max-workers=2
      - name: Verify native libraries are packaged for the selected ABI
        env:
          USBIP_ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          abi = os.environ['USBIP_ABI']
          for directory, pattern, prefix in [
              ('usbip-diagnostics/build/outputs/apk/debug', '*.apk', 'lib'),
              ('usbip-backend/build/outputs/aar', '*-debug.aar', 'jni'),
          ]:
              archives = list(Path(directory).glob(pattern))
              assert archives, f'No archives in {directory}'
              for archive in archives:
                  with ZipFile(archive) as package:
                      for library in ['libmoonlight_usbip.so', 'libc++_shared.so']:
                          assert f'{prefix}/{abi}/{library}' in package.namelist(), (archive, abi, library)
          PY
      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-usbip-${{ matrix.artifact }}-development
          path: |
            usbip-diagnostics/build/outputs/apk/debug/*.apk
            usbip-backend/build/outputs/aar/*.aar
            usbip-backend/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Install emulator image
        if: matrix.abi == 'arm64-v8a'
        run: |
          sdkmanager 'system-images;android-34;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name usbip-ci --package 'system-images;android-34;google_apis;x86_64' --device pixel_2
          test -f "$ANDROID_AVD_HOME/usbip-ci.ini"
          sudo chmod 666 /dev/kvm
      - name: Run native lifecycle tests on Android x86_64
        if: matrix.abi == 'arm64-v8a'
        timeout-minutes: 15
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          test -f "$ANDROID_AVD_HOME/usbip-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -avd usbip-ci -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          for attempt in $(seq 1 120); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          bash gradlew -p usbip-diagnostics :usbip-backend:connectedDebugAndroidTest -PusbipTestAbi=x86_64 --max-workers=2
      - name: Upload emulator test results
        if: always() && matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: android-usbip-test-results
          path: |
            usbip-backend/build/outputs/androidTest-results/
            emulator.log
