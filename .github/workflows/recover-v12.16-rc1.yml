name: Recover empty v12.16-rc1 release

on:
  push:
    branches: [ops/recover-v12.16-rc1-20261127]
    paths: [.github/workflows/recover-v12.16-rc1.yml]

permissions: {}

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: moonlight-release-publication
      queue: max
    steps:
      - name: Remove only the verified empty release and preserve its tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = 'qiin2333/moonlight-vplus'
          tag = 'v12.16-rc1'
          release_id = 460167824
          commit = '42a3ce4f8e943cbcf93532f6ab366206a76b251b'
          if os.environ['GITHUB_REPOSITORY'] != repo:
              raise SystemExit('Unexpected repository; no changes made')

          def api(path, *options):
              return subprocess.check_output(['gh', 'api', path, *options])

          def verify_tag():
              ref = json.loads(api(f'repos/{repo}/git/ref/tags/{tag}'))
              if (ref.get('ref') != f'refs/tags/{tag}' or
                      ref.get('object', {}).get('type') != 'commit' or
                      ref['object'].get('sha') != commit):
                  raise SystemExit('Tag changed; no further changes allowed')

          verify_tag()
          release = json.loads(api(f'repos/{repo}/releases/{release_id}'))
          if not (release.get('id') == release_id and
                  release.get('tag_name') == tag and
                  release.get('draft') is False and
                  release.get('prerelease') is True and
                  release.get('immutable') is False and
                  release.get('assets') == [] and
                  release.get('name') == '' and
                  release.get('body') == ''):
              raise SystemExit('Release is no longer the expected empty placeholder; no changes made')

          api(f'repos/{repo}/releases/{release_id}', '--method', 'DELETE')
          verify_tag()
          print(f'Removed empty release {release_id}; kept {tag} at {commit}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Removed only the verified empty v12.16-rc1 Release.\n\n')
              summary.write(f'Preserved refs/tags/{tag} at `{commit}`.\n\n')
              summary.write('The original failed release job can now be retried.\n')
          PY
