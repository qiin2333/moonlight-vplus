name: Display lifecycle tests

on:
  pull_request:
    paths:
      - 'display-tests/**'
      - 'app/src/main/java/com/limelight/Game.kt'
      - 'app/src/main/java/com/limelight/ExternalDisplayManager.kt'
      - 'app/src/main/java/com/limelight/TargetDisplayResolver.kt'
      - 'app/src/main/java/com/limelight/DisplayModeWindowApplier.kt'
      - 'app/src/main/java/com/limelight/DisplayReconnectSettings.kt'
      - 'app/src/main/java/com/limelight/LimeLog.kt'
      - 'app/src/main/java/com/limelight/ui/StreamView.kt'
      - 'app/src/main/java/com/limelight/binding/input/capture/InputCaptureProvider.kt'
      - 'app/src/main/java/com/limelight/preferences/PreferenceConfiguration.kt'
      - 'app/src/androidTest/java/com/limelight/ExternalDisplayManagerTest.kt'
      - 'app/src/androidTest/java/com/limelight/TargetDisplayResolverTest.kt'
      - 'gradle/wrapper/**'
      - '.github/workflows/display-lifecycle-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  display-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and emulator image
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-34;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/display-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name display-ci --package 'system-images;android-34;google_apis;x86_64' --device pixel_2
          sudo chmod 666 /dev/kvm
      - name: Run display lifecycle regressions
        timeout-minutes: 15
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/display-avd"
          "$ANDROID_HOME/emulator/emulator" -avd display-ci -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 120); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          bash gradlew -p display-tests connectedDebugAndroidTest --max-workers=2 --console=plain
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-lifecycle-test-results
          path: |
            display-tests/build/outputs/androidTest-results/
            display-tests/build/reports/androidTests/
            emulator.log
